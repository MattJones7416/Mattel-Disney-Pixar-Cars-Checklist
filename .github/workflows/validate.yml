name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalogue-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: catalog-worker/package-lock.json
      - name: Validate catalogue
        run: npm run catalog:validate
      - name: Install Worker dependencies
        run: npm ci
        working-directory: catalog-worker
      - name: Type-check and dry-run Worker
        run: npm run check
        working-directory: catalog-worker
